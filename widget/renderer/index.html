<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- Pet view (also shows the pre-hatch egg) -->
      <div id="pet" class="hidden">
        <div id="bubble" class="hidden"></div>
        <div id="celebrate" class="hidden">🎉</div>
        <div id="toast" class="hidden"></div>
        <div id="sprite"><canvas id="live2d"></canvas><canvas id="stage3d"></canvas><div id="particles"></div><div id="sprite-stage"><img id="sprite-img" class="hidden" /><span id="sprite-base"></span></div></div>
        <div id="panel" class="hidden">
          <div id="panel-name"></div>
          <div id="panel-level"></div>
          <div class="xpbar"><div id="xpfill"></div></div>
          <div id="panel-mood"></div>
          <div id="panel-project"></div>
          <div id="panel-ach"></div>
        </div>
      </div>
    </div>
    <script src="vendor/three.min.js"></script>
    <script src="pet3d.js"></script>
    <script src="petlive2d.js"></script>
    <script src="pet.js"></script>
  </body>
</html>
